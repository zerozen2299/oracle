<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oracle — ไพ่ทาโรต์</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cinzel+Decorative:wght@400;700&family=Sarabun:wght@300;400&display=swap" rel="stylesheet">

<body>
<div id="flash"></div>
<canvas id="galaxyCanvas"></canvas>
<div class="rune" style="top:15%;left:5%;font-size:2rem;--dl:0s">ᚱ</div>
<div class="rune" style="top:8%;right:6%;font-size:1.5rem;--dl:1.5s">ᛟ</div>
<div class="rune" style="bottom:10%;left:7%;font-size:1.8rem;--dl:1s">ᛉ</div>
<div class="rune" style="bottom:8%;right:5%;font-size:1.4rem;--dl:2.5s">ᚹ</div>

<!-- LANDING -->
<div id="landing">
  <div class="ceiling"></div>
  <div id="rope" class="rope-wrap">
    <div class="hook"></div>
    <div class="rope" style="height:160px"></div>
    <div class="knot"></div>
    <div class="rope" style="height:70px"></div>
    <div class="lantern" id="lantern">
      <div class="lt"></div>
      <div class="lb"><div class="lf">🕯</div></div>
      <div class="lbase"></div>
    </div>
  </div>
  <div class="l-hint">· ดึงโคมไฟ ·</div>
</div>


<!-- CURTAIN (เปิดม่านหลังดึงโคมไฟ) -->
<div id="curtain">
  <div class="curtain-left"></div>
  <div class="curtain-right"></div>
  <div class="curtain-center-glow"></div>
</div>

<!-- APP -->
<div id="app">
  <div class="app-title">ห้องแห่งโชคชะตา</div>
  <div class="app-sub">CHAMBER OF FATE</div>

  <div class="main-layout">

    <!-- WITCH + TABLE (ซ้าย) -->
    <div class="witch-col">
    <div class="witch-section">
      <!-- SVG แม่มด -->
      <svg id="witchSvg" class="witch-svg" width="720" height="820" viewBox="0 0 720 820" fill="none" xmlns="http://www.w3.org/2000/svg">

            <div class="dc">✦</div><div class="dc">✦</div><div class="dc">✦</div>
          </div>
          <div class="deck-lbl">หยิบสำรับไพ่</div>
        </div>
        <div class="drawn-card" id="drawnCard">

          <div id="drawnEmoji" style="font-size:1.5rem">☀️</div>
        </div>
      </div>
      <div class="table-leg"></div>

        <button class="btn-again" id="btnAgain" onclick="reset()">✦ ทำนายอีกครั้ง ✦</button>
      </div>
    </div>
